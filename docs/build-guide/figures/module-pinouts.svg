<text x="380.0" y="612.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">+5V, GND from the LM2596</text>
<text x="40.0" y="634.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">J9–J13 (B)</text>
