<text x="605.0" y="488.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Buzzer + LED</text>
<text x="605.0" y="504.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">latched alarm</text>
<text x="605.0" y="518.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">GPIO27</text>
<text x="30.0" y="560.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• Ratings: 5 A continuous discharge, 1.5 A charge; 16 AWG for the power path, 22 AWG for sense wires.</text>
<text x="30.0" y="578.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• Charge and load are never used at the same time in the prototype (one current monitor serves both).</text>
<text x="30.0" y="596.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• The LM2596 takes P−, so a hardware BMS cut-off also removes controller power (section 4).</text>
<text x="30.0" y="614.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• Feeding it before the shunt keeps its own current out of the measurement, so the pack can read 'at rest'.</text>
</svg>
