<text x="415.0" y="518.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">contacts in the feeders</text>
<line x1="605.0" y1="440.0" x2="605.0" y2="470.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
