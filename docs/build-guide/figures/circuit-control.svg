<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Circuit: ESP32 control, relays and alarm (board B, architecture section 7)</text>
<rect x="420.0" y="80.0" width="260.0" height="420.0" rx="6" fill="#eef4fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="550.0" y="98.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1d1b">ESP32 DevKit V1</text>
<line x1="380.0" y1="140.0" x2="420.0" y2="140.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="426.0" y="144.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">GPIO25</text>
<line x1="380.0" y1="220.0" x2="420.0" y2="220.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="426.0" y="224.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">GPIO26</text>
<line x1="380.0" y1="330.0" x2="420.0" y2="330.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="426.0" y="334.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">GPIO27</text>
<line x1="380.0" y1="430.0" x2="420.0" y2="430.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="426.0" y="434.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">GPIO0 (BOOT)</text>
<line x1="680.0" y1="120.0" x2="720.0" y2="120.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="674.0" y="124.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">VIN</text>
<line x1="680.0" y1="160.0" x2="720.0" y2="160.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="674.0" y="164.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">GND</text>
<line x1="680.0" y1="200.0" x2="720.0" y2="200.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="674.0" y="204.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">3V3 out</text>
<line x1="680.0" y1="280.0" x2="720.0" y2="280.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="674.0" y="284.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">GPIO21 SDA</text>
<line x1="680.0" y1="310.0" x2="720.0" y2="310.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="674.0" y="314.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">GPIO22 SCL</text>
<line x1="680.0" y1="380.0" x2="720.0" y2="380.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="674.0" y="384.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">GPIO32–36</text>
<text x="726.0" y="124.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">5 V from the LM2596 (J4)</text>
<text x="726.0" y="164.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">electronics ground (P−)</text>
<text x="726.0" y="204.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">ADS1115, INA226, pull-ups, NTC dividers</text>
<text x="726.0" y="284.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">ADS1115 and INA226 (I2C)</text>
<text x="726.0" y="314.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48"></text>
<text x="726.0" y="384.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">NTC1–NTC5 dividers</text>
<circle cx="330.0" cy="140.0" r="2.8" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1.2"/>
<line x1="330.0" y1="140.0" x2="380.0" y2="140.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="330.0" y1="140.0" x2="330.0" y2="125.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="330.0" y1="95.0" x2="330.0" y2="80.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<rect x="324.5" y="95.0" width="11.0" height="30.0" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="320.0" y="108.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">R6</text>
<text x="320.0" y="122.0" font-size="11" text-anchor="end" font-weight="normal" fill="#4f4d48">10 kΩ</text>
<line x1="330.0" y1="80.0" x2="330.0" y2="72.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="321.0" y1="72.0" x2="339.0" y2="72.0" stroke="#1d1d1b" stroke-width="2" stroke-linecap="round"/>
<text x="330.0" y="67.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#1d1d1b">3V3</text>
<line x1="160.0" y1="140.0" x2="330.0" y2="140.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="150.0" y="144.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">relay IN1 (K_LOAD)</text>
<circle cx="330.0" cy="220.0" r="2.8" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1.2"/>
<line x1="330.0" y1="220.0" x2="380.0" y2="220.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="330.0" y1="220.0" x2="330.0" y2="215.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="330.0" y1="185.0" x2="330.0" y2="180.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<rect x="324.5" y="185.0" width="11.0" height="30.0" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="320.0" y="198.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">R7</text>
<text x="320.0" y="212.0" font-size="11" text-anchor="end" font-weight="normal" fill="#4f4d48">10 kΩ</text>
<line x1="330.0" y1="180.0" x2="330.0" y2="172.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="321.0" y1="172.0" x2="339.0" y2="172.0" stroke="#1d1d1b" stroke-width="2" stroke-linecap="round"/>
<text x="330.0" y="167.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#1d1d1b">3V3</text>
<line x1="160.0" y1="220.0" x2="330.0" y2="220.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="150.0" y="224.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">relay IN2 (K_CHARGE)</text>
<rect x="40.0" y="530.0" width="170.0" height="64.0" rx="6" fill="#f6f4ee" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="125.0" y="548.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Relay module</text>
<text x="125.0" y="564.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">2 × 5 V inputs, active LOW</text>
<text x="125.0" y="578.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">VCC 5 V · GND</text>
<text x="226.0" y="556.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">LOW closes a contact. HIGH or floating leaves it open, so reset,</text>
<text x="226.0" y="572.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">a crash or an unpowered ESP32 leave both branches open.</text>
<line x1="200.0" y1="330.0" x2="380.0" y2="330.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="300.0" cy="330.0" r="2.8" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="196.0" y="334.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">buzzer module I/O</text>
<line x1="300.0" y1="330.0" x2="300.0" y2="350.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="300.0" y1="380.0" x2="300.0" y2="400.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<rect x="294.5" y="350.0" width="11.0" height="30.0" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="290.0" y="363.0" font-size="11" text-anchor="end" font-weight="bold" fill="#1d1d1b">R8</text>
<text x="290.0" y="377.0" font-size="11" text-anchor="end" font-weight="normal" fill="#4f4d48">330 Ω</text>
<line x1="300.0" y1="400.0" x2="300.0" y2="410.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="290.0,410.0 310.0,410.0 300.0,426.0" fill="#fff" stroke="#1d1d1b" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="290.0" y1="427.0" x2="310.0" y2="427.0" stroke="#1d1d1b" stroke-width="2" stroke-linecap="round"/>
<text x="316.0" y="422.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">LED1 red</text>
<line x1="300.0" y1="427.0" x2="300.0" y2="440.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="300.0" y1="440.0" x2="300.0" y2="446.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="288.0" y1="446.0" x2="312.0" y2="446.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="292.0" y1="450.0" x2="308.0" y2="450.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="296.0" y1="454.0" x2="304.0" y2="454.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="700.0" y="440.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">LED current ≈ (3.3 V − LED voltage) / R8:</text>
<text x="700.0" y="456.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">about 4 mA with a 2 V red LED.</text>
<text x="700.0" y="480.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">Set CONFIG_BMS_ALARM_ACTIVE_LOW if the buzzer</text>
<text x="700.0" y="496.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">module sounds on LOW (check at Gate 2).</text>
<text x="40.0" y="630.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1d1d1b">Steady alarm = latched trip. Pulsing at 1 Hz = risk level Warning.</text>
<text x="40.0" y="650.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">Check at Gate 2 that a 3.3 V HIGH fully releases each 5 V relay input; if not, add a transistor stage (section 7).</text>
</svg>
