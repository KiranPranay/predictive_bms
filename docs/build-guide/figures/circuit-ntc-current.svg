<text x="760.0" y="140.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">ADC1_CH5</text>
<text x="470.0" y="160.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1d1d1b">NTC3</text>
<text x="560.0" y="160.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">cell 3</text>
<text x="640.0" y="160.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">GPIO34</text>
<text x="760.0" y="160.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">ADC1_CH6</text>
<text x="470.0" y="180.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1d1d1b">NTC4</text>
<text x="560.0" y="180.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">cell 4</text>
<text x="640.0" y="180.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">GPIO35</text>
<text x="760.0" y="180.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">ADC1_CH7</text>
<text x="470.0" y="200.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1d1d1b">NTC5</text>
<text x="560.0" y="200.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">air</text>
<text x="640.0" y="200.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">GPIO36 (VP)</text>
<text x="760.0" y="200.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">ADC1_CH0</text>
<text x="470.0" y="240.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">ADC1 only: ADC2 does not work while Wi-Fi is on. At 25 °C the node sits at 1.65 V.</text>
<text x="470.0" y="258.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">Bond NTC1–4 at mid-can with insulating, thermally conductive tape; never on nickel.</text>
<text x="40.0" y="390.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1d1d1b">Pack current: 5 mΩ shunt with Kelvin sense, INA226</text>
<line x1="60.0" y1="420.0" x2="120.0" y2="420.0" stroke="#1d1d1b" stroke-width="3" stroke-linecap="round"/>
<text x="60.0" y="412.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#4f4d48">from F1 (X)</text>
<line x1="120.0" y1="420.0" x2="200.0" y2="420.0" stroke="#1d1d1b" stroke-width="3" stroke-linecap="round"/>
<rect x="200.0" y="410.0" width="120.0" height="20.0" rx="0" fill="#fff" stroke="#1d1d1b" stroke-width="1.6"/>
<text x="260.0" y="424.0" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1d1d1b">R_SH 5 mΩ</text>
<line x1="320.0" y1="420.0" x2="440.0" y2="420.0" stroke="#1d1d1b" stroke-width="3" stroke-linecap="round"/>
<text x="440.0" y="412.0" font-size="10.5" text-anchor="end" font-weight="normal" fill="#4f4d48">FUSED+ to the feeders</text>
<line x1="205.0" y1="430.0" x2="205.0" y2="490.0" stroke="#00897b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="315.0" y1="430.0" x2="315.0" y2="490.0" stroke="#00695c" stroke-width="1.6" stroke-linecap="round"/>
<text x="198.0" y="470.0" font-size="10.5" text-anchor="end" font-weight="bold" fill="#00897b">IN+</text>
<text x="322.0" y="470.0" font-size="10.5" text-anchor="start" font-weight="bold" fill="#00695c">IN−</text>
<rect x="160.0" y="490.0" width="200.0" height="110.0" rx="6" fill="#eef4fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="260.0" y="508.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">INA226</text>
<text x="260.0" y="524.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">IN+ / IN− across the shunt only</text>
<text x="260.0" y="538.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">VBS joined to IN−</text>
<text x="260.0" y="552.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">VCC 3V3 · GND</text>
<text x="260.0" y="566.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">SCL GPIO22 · SDA GPIO21</text>
<text x="260.0" y="580.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">address 0x40 (A0, A1 to GND)</text>
<text x="470.0" y="440.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• Remove or bypass the module's own R100 shunt (BOM item 12).</text>
<text x="470.0" y="460.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• Twist the two sense leads; take them from the shunt's own pads (Kelvin).</text>
<text x="470.0" y="480.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• At 5 A the shunt drops 25 mV and dissipates 0.125 W.</text>
<text x="470.0" y="500.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• Positive current = discharge (IN+ on the fuse side).</text>
</svg>
