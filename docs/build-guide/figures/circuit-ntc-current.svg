<line x1="230.0" y1="220.0" x2="350.0" y2="220.0" stroke="#1d1d1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="356.0" y="224.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">to ESP32 ADC1</text>
<text x="470.0" y="98.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">Sensor</text>
<text x="560.0" y="98.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">Where</text>
<text x="640.0" y="98.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">Pin</text>
<text x="760.0" y="98.0" font-size="11" text-anchor="start" font-weight="bold" fill="#1d1d1b">Channel</text>
<text x="470.0" y="120.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1d1d1b">NTC1</text>
<text x="560.0" y="120.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">cell 1</text>
<text x="640.0" y="120.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">GPIO32</text>
<text x="760.0" y="120.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">ADC1_CH4</text>
