<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">How the supervisor decides: one 5 Hz sample (safety task, ESP32 core 1)</text>
<text x="30.0" y="52.0" font-size="12" text-anchor="start" font-weight="normal" fill="#4f4d48">Every block is in firmware/components/bms_core and runs unchanged in the simulator. Wi-Fi and the dashboard only read a copy; nothing safe waits for them.</text>
<rect x="30.0" y="80.0" width="190.0" height="96.0" rx="6" fill="#eef4fb" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="125.0" y="98.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Sensors</text>
<text x="125.0" y="114.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">ADS1115: 4 taps</text>
<text x="125.0" y="128.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">INA226: pack current</text>
<text x="125.0" y="142.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">ADC1: 5 NTCs</text>
<rect x="260.0" y="80.0" width="230.0" height="96.0" rx="6" fill="#eef4fb" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="375.0" y="98.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Front end (sections 5, 6, 8)</text>
<text x="375.0" y="114.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">calibration · plausibility</text>
<text x="375.0" y="128.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">median of 5 · 10 s low-pass</text>
<text x="375.0" y="142.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">dT/dt over 30 s</text>
<rect x="530.0" y="80.0" width="230.0" height="96.0" rx="6" fill="#fdf2e9" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="645.0" y="98.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Fixed limits (section 8)</text>
<text x="645.0" y="114.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">V, I, temperature, spread,</text>
<text x="645.0" y="128.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">rate of rise; persistence,</text>
<text x="645.0" y="142.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">hysteresis</text>
<rect x="260.0" y="220.0" width="230.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="375.0" y="238.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Thermal model + Kalman</text>
<text x="375.0" y="254.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">per cell, 9.1 and 9.2:</text>
<text x="375.0" y="268.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">core temperature T_c,</text>
<text x="375.0" y="282.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">abnormal heat Q_ab (W),</text>
<text x="375.0" y="296.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">cell vs the other three</text>
<rect x="530.0" y="220.0" width="230.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="645.0" y="238.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Predict and confirm (9.3)</text>
<text x="645.0" y="254.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">forecast 1 and 5 min ahead,</text>
<text x="645.0" y="268.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">check each when due,</text>
<text x="645.0" y="282.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">RMS accuracy record</text>
<rect x="800.0" y="220.0" width="220.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="910.0" y="238.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Forecasts (9.6)</text>
<text x="910.0" y="254.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">settling temperature,</text>
<text x="910.0" y="268.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">time to limit,</text>
<text x="910.0" y="282.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">safe continuous current</text>
<rect x="260.0" y="370.0" width="230.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="375.0" y="388.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Electrical evidence</text>
<text x="375.0" y="404.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">online resistance (9.4)</text>
<text x="375.0" y="418.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">rest leak estimate (9.5)</text>
<text x="375.0" y="432.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">energy cross-check</text>
<rect x="530.0" y="370.0" width="230.0" height="110.0" rx="6" fill="#fdf2e9" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="645.0" y="388.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Risk level (9.7, 9.8)</text>
<text x="645.0" y="404.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">Normal → Watch → Warning → Trip</text>
<text x="645.0" y="418.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">thermal + electrical must agree</text>
<text x="645.0" y="432.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">for a soft fault; self-</text>
<text x="645.0" y="446.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">acceleration trips at once</text>
<rect x="830.0" y="80.0" width="330.0" height="110.0" rx="6" fill="#fdeceb" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="995.0" y="98.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Latch and outputs</text>
<text x="995.0" y="114.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">K_LOAD, K_CHARGE: each trip opens</text>
<text x="995.0" y="128.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">its own branch, or both</text>
<text x="995.0" y="142.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">latched in flash; manual reset only</text>
<text x="995.0" y="156.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">alarm: steady trip, 1 Hz Warning</text>
<rect x="830.0" y="400.0" width="330.0" height="80.0" rx="6" fill="#f6f4ee" stroke="#1d1d1b" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="995.0" y="418.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Telemetry (not safety)</text>
<text x="995.0" y="434.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">dashboard JSON once a second</text>
<text x="995.0" y="448.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">CSV log for the Gate 9 fit</text>
<line x1="220.0" y1="128.0" x2="260.0" y2="128.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="260.0,128.0 251.7,131.5 251.7,124.5" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="490.0" y1="128.0" x2="530.0" y2="128.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="530.0,128.0 521.7,131.5 521.7,124.5" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="760.0" y1="128.0" x2="830.0" y2="128.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="830.0,128.0 821.7,131.5 821.7,124.5" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="375.0" y1="176.0" x2="375.0" y2="220.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="375.0,220.0 371.5,211.7 378.5,211.7" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="490.0" y1="275.0" x2="530.0" y2="275.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="530.0,275.0 521.7,278.5 521.7,271.5" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="760.0" y1="275.0" x2="800.0" y2="275.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="800.0,275.0 791.7,278.5 791.7,271.5" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="262.0,168.0 243.0,168.0 243.0,418.0" fill="none" stroke="#1d1d1b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="243.0" y1="418.0" x2="260.0" y2="418.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="260.0,418.0 251.7,421.5 251.7,414.5" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="645.0" y1="330.0" x2="645.0" y2="370.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="645.0,370.0 641.5,361.7 648.5,361.7" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="490.0" y1="418.0" x2="530.0" y2="418.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="530.0,418.0 521.7,421.5 521.7,414.5" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="910.0" y1="330.0" x2="760.0" y2="400.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="760.0,400.0 766.0,393.3 769.0,399.7" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="760.0,440.0 786.0,440.0 786.0,172.0" fill="none" stroke="#1d1d1b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="786.0" y1="172.0" x2="830.0" y2="172.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="830.0,172.0 821.7,175.5 821.7,168.5" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="760.0" y1="450.0" x2="830.0" y2="440.0" stroke="#1d1d1b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="830.0,440.0 822.3,444.6 821.3,437.7" fill="#1d1d1b" stroke="#1d1d1b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="30.0" y="520.0" font-size="12" text-anchor="start" font-weight="normal" fill="#4f4d48">Hardware BMS (layer A) acts on its own, below all of this: over- and under-voltage, short circuit, balancing.</text>
<text x="30.0" y="540.0" font-size="12" text-anchor="start" font-weight="normal" fill="#4f4d48">Watchdog: if this task stops for 2 s the ESP32 restarts, both relays open, and the restart itself is latched (section 10).</text>
</svg>
