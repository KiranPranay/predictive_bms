<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Enclosure layout (top view, lid removed)</text>
<text x="30.0" y="52.0" font-size="12" text-anchor="start" font-weight="normal" fill="#4f4d48">Vented PETG case (section 2 and 11). Not a fire enclosure: never seal it.</text>
<rect x="40.0" y="80.0" width="1020.0" height="460.0" rx="14" fill="#f7f6f2" stroke="#1d1d1b" stroke-width="2"/>
<rect x="60.0" y="100.0" width="420.0" height="200.0" rx="10" fill="#fdf2e9" stroke="#8a6d3b" stroke-width="1.2"/>
<text x="270.0" y="130.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Pack bay</text>
<text x="270.0" y="150.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#4f4d48">4S1P in spacers, fish paper, sleeve</text>
<rect x="90.0" y="170.0" width="70.0" height="110.0" rx="12" fill="#fbe3d6" stroke="#8a6d3b" stroke-width="1.2"/>
<text x="125.0" y="230.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">C1</text>
<rect x="185.0" y="170.0" width="70.0" height="110.0" rx="12" fill="#fbe3d6" stroke="#8a6d3b" stroke-width="1.2"/>
<text x="220.0" y="230.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">C2</text>
<rect x="280.0" y="170.0" width="70.0" height="110.0" rx="12" fill="#fbe3d6" stroke="#8a6d3b" stroke-width="1.2"/>
<text x="315.0" y="230.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">C3</text>
<rect x="375.0" y="170.0" width="70.0" height="110.0" rx="12" fill="#fbe3d6" stroke="#8a6d3b" stroke-width="1.2"/>
<text x="410.0" y="230.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d1d1b">C4</text>
<rect x="60.0" y="320.0" width="420.0" height="200.0" rx="10" fill="#fbeaea" stroke="#d03b3b" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="270.0" y="350.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#b02a2a">Power side</text>
<text x="80.0" y="380.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• Hardware BMS on insulated standoffs</text>
<text x="80.0" y="402.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• F1 fuse holder at the B+ exit (access hatch)</text>
<text x="80.0" y="424.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• Shunt, then the branch wiring</text>
<text x="80.0" y="446.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• Relay module: contacts away from the sensing</text>
<text x="80.0" y="468.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• LM2596</text>
<text x="80.0" y="490.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">• XT60 load and charge plugs in cable glands</text>
<rect x="520.0" y="100.0" width="520.0" height="300.0" rx="10" fill="#eef4fb" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="780.0" y="130.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f5fae">Sensing side (removable electronics lid)</text>
<rect x="550.0" y="160.0" width="210.0" height="160.0" rx="6" fill="#f4f0fb" stroke="#6a3fd0" stroke-width="1.2"/>
<text x="655.0" y="245.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Board A</text>
<rect x="790.0" y="160.0" width="230.0" height="160.0" rx="6" fill="#e3eefa" stroke="#2a78d6" stroke-width="1.2"/>
<text x="905.0" y="245.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1d1b">Board B (ESP32)</text>
<text x="780.0" y="350.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#4f4d48">USB of the ESP32 reachable through a slot for the console</text>
<text x="780.0" y="370.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#4f4d48">Tap and NTC wires restrained, away from relay and power wiring</text>
<rect x="520.0" y="420.0" width="520.0" height="100.0" rx="10" fill="#f0f7f0" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="780.0" y="450.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2e7d32">Vent path</text>
<circle cx="940.0" cy="480.0" r="9" fill="#0f8a8a" stroke="#0f8a8a" stroke-width="1.2"/>
<text x="925.0" y="485.0" font-size="11" text-anchor="end" font-weight="normal" fill="#4f4d48">NTC5 in free air here, away from cells, LM2596, relays</text>
<rect x="560.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<rect x="590.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<rect x="620.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<rect x="650.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<rect x="680.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<rect x="710.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<rect x="740.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<rect x="770.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<rect x="800.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<rect x="830.0" y="500.0" width="18.0" height="8.0" rx="0" fill="#cfd8cf" stroke="#2e7d32" stroke-width="0.8"/>
<text x="40.0" y="570.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#4f4d48">Metal fasteners never near a cell can · strain relief on every cable · labels: B−, B1, B2, B3, B+, P−, P+, LOAD−, CHARGE−, fuse rating.</text>
</svg>
