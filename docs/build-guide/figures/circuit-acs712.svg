<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="32.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1d1d1b">Temporary: ACS712 current sensor wiring (replaces INA226 until it arrives)</text>
<text x="30.0" y="52.0" font-size="12" text-anchor="start" font-weight="normal" fill="#4f4d48">The ACS712 Hall sensor provides analog current sensing on ESP32 pin VN (GPIO39, ADC1_CH3). Keep J8 and J14 headers in place on Board B so you can plug in the INA226 without reworking the board.</text>
<text x="40.0" y="110.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1d1d1b">Power path (in series with Pack Positive after fuse F1)</text>
<line x1="60.0" y1="140.0" x2="180.0" y2="140.0" stroke="#d03b3b" stroke-width="5" stroke-linecap="round"/>
<text x="60.0" y="130.0" font-size="11" text-anchor="start" font-weight="bold" fill="#d03b3b">from F1 (7.5A fuse at B+)</text>
<rect x="260.0" y="100.0" width="320.0" height="260.0" rx="6" fill="#fdfaf3" stroke="#e07b00" stroke-width="1.2"/>
<text x="420.0" y="118.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1d1b">ACS712 Module (5A variant)</text>
<text x="420.0" y="134.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">Hall-effect isolated sensor</text>
<text x="420.0" y="148.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#4f4d48">Internal conductor: ~1.2 mΩ</text>
<rect x="240.0" y="124.0" width="40.0" height="32.0" rx="4" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/>
<text x="260.0" y="145.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#1d1d1b">IP+</text>
<line x1="180.0" y1="140.0" x2="240.0" y2="140.0" stroke="#d03b3b" stroke-width="5" stroke-linecap="round"/>
<rect x="560.0" y="124.0" width="40.0" height="32.0" rx="4" fill="#cfd8dc" stroke="#455a64" stroke-width="1.2"/>
<text x="580.0" y="145.0" font-size="11" text-anchor="middle" font-weight="bold" fill="#1d1d1b">IP−</text>
<line x1="600.0" y1="140.0" x2="720.0" y2="140.0" stroke="#d03b3b" stroke-width="5" stroke-linecap="round"/>
<text x="610.0" y="130.0" font-size="11" text-anchor="start" font-weight="bold" fill="#d03b3b">FUSED+ (to K_LOAD &amp; K_CHARGE)</text>
<circle cx="380.0" cy="335.0" r="5" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="380.0" y="325.0" font-size="10" text-anchor="middle" font-weight="bold" fill="#1d1d1b">VCC</text>
<circle cx="420.0" cy="335.0" r="5" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="420.0" y="325.0" font-size="10" text-anchor="middle" font-weight="bold" fill="#1d1d1b">OUT</text>
<circle cx="460.0" cy="335.0" r="5" fill="#fff" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="460.0" y="325.0" font-size="10" text-anchor="middle" font-weight="bold" fill="#1d1d1b">GND</text>
<rect x="720.0" y="160.0" width="380.0" height="260.0" rx="6" fill="#eef4fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="910.0" y="178.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1d1b">ESP32 DevKit (Board B)</text>
<text x="740.0" y="200.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">Top row header (r = 2 on Board B):</text>
<line x1="690.0" y1="240.0" x2="720.0" y2="240.0" stroke="#0f8a8a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="690.0" cy="240.0" r="4" fill="#0f8a8a" stroke="#1d1d1b" stroke-width="1.2"/>
<text x="730.0" y="244.0" font-size="11" text-anchor="start" font-weight="bold" fill="#0f8a8a">VN / GPIO39 (ADC1_CH3)</text>
<text x="730.0" y="260.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#4f4d48">pin 13 on top row header (c = 13, r = 2)</text>
<line x1="690.0" y1="300.0" x2="720.0" y2="300.0" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/>
<text x="730.0" y="304.0" font-size="11" text-anchor="start" font-weight="bold" fill="#d03b3b">3V3 (or Board B 3V3 rail)</text>
<line x1="690.0" y1="350.0" x2="720.0" y2="350.0" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
<text x="730.0" y="354.0" font-size="11" text-anchor="start" font-weight="bold" fill="#2b2b2b">GND (or Board B GND rail)</text>
<line x1="420.0" y1="340.0" x2="420.0" y2="380.0" stroke="#0f8a8a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="420.0" y1="380.0" x2="600.0" y2="380.0" stroke="#0f8a8a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="600.0" y1="380.0" x2="600.0" y2="240.0" stroke="#0f8a8a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="600.0" y1="240.0" x2="690.0" y2="240.0" stroke="#0f8a8a" stroke-width="2.5" stroke-linecap="round"/>
<text x="590.0" y="372.0" font-size="10.5" text-anchor="end" font-weight="bold" fill="#0f8a8a">OUT (analog voltage)</text>
<line x1="380.0" y1="340.0" x2="380.0" y2="410.0" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/>
<line x1="380.0" y1="410.0" x2="640.0" y2="410.0" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/>
<line x1="640.0" y1="410.0" x2="640.0" y2="300.0" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/>
<line x1="640.0" y1="300.0" x2="690.0" y2="300.0" stroke="#d03b3b" stroke-width="2" stroke-linecap="round"/>
<line x1="460.0" y1="340.0" x2="460.0" y2="430.0" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
<line x1="460.0" y1="430.0" x2="670.0" y2="430.0" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
<line x1="670.0" y1="430.0" x2="670.0" y2="350.0" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
<line x1="670.0" y1="350.0" x2="690.0" y2="350.0" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
<text x="40.0" y="440.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1d1d1b">Important notes for temporary ACS712 use:</text>
<text x="40.0" y="460.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">1. Power from 3.3 V (not 5 V): keeping VCC at 3.3 V ensures the ACS712 output stays safe for the ESP32 ADC (0-3.3 V max).</text>
<text x="40.0" y="480.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">2. No external 5 mΩ shunt needed: the ACS712 has its own internal conductor carrying the pack current.</text>
<text x="40.0" y="500.0" font-size="11" text-anchor="start" font-weight="normal" fill="#4f4d48">3. When INA226 arrives: remove ACS712, plug INA226 into J8, reconnect the 5 mΩ shunt Kelvin pair to J14. No board rewiring needed.</text>
</svg>
