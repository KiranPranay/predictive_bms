# Builds the Windows package and tests it on Windows as a user would use it: the demo started
# from its .bat file, the Octave scripts in GNU Octave for Windows, the KiCad projects in KiCad
# for Windows (with KiCad's own ngspice), and the Xcos models in Scilab for Windows.
# On a tag v*, the package is attached to a GitHub release.
name: Windows package

on:
  push:
    branches: [main, windows-package]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_EMBED: "3.12.10"
  OCTAVE_VERSION: "10.3.0"
  KICAD_VERSION: "10.0.7"
  SCILAB_VERSION: "2027.0.0"   # the version the Xcos models are made with
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the simulator (MSVC, C++ runtime linked in)
        run: |
          cmake -S host -B build/host -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build/host --config Release --parallel

      - name: Unit tests and scenarios
        run: ctest --test-dir build/host -C Release --output-on-failure

      - name: bms_sim.exe needs no Visual C++ runtime on the user's PC
        run: |
          python -m pip install --quiet pefile
          python -c "import pefile,sys; pe=pefile.PE('build/host/Release/bms_sim.exe'); dlls=[e.dll.decode() for e in pe.DIRECTORY_ENTRY_IMPORT]; print(dlls); bad=[d for d in dlls if d.lower().startswith(('msvcp','vcruntime'))]; sys.exit(f'needs {bad}' if bad else 0)"

      - name: Python tools tests
        run: |
          python -m pip install --quiet -r tools/requirements.txt
          python -m unittest discover -s tools/tests -v

      - name: Make the package
        run: |
          curl.exe -L --fail --retry 3 -o python-embed.zip "https://www.python.org/ftp/python/$env:PYTHON_EMBED/python-$env:PYTHON_EMBED-embed-amd64.zip"
          python tools/package_windows.py --exe build/host/Release/bms_sim.exe --python python-embed.zip --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: PredictiveBMS-Windows
          path: dist/PredictiveBMS-Windows.zip
          if-no-files-found: error

      - name: "Test: the demo, started from its .bat file"
        run: python .github/scripts/demo_check.py dist/PredictiveBMS

      - name: Restore the installers
        id: installers
        uses: actions/cache/restore@v4
        with:
          path: installers
          key: installers-octave${{ env.OCTAVE_VERSION }}-kicad${{ env.KICAD_VERSION }}-scilab${{ env.SCILAB_VERSION }}

      - name: Download the installers
        if: steps.installers.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force installers | Out-Null
          curl.exe -L --fail --retry 3 -o installers/octave.7z "https://ftp.gnu.org/gnu/octave/windows/octave-$env:OCTAVE_VERSION-w64.7z"
          curl.exe -L --fail --retry 3 -o installers/kicad.exe "https://github.com/KiCad/kicad-source-mirror/releases/download/$env:KICAD_VERSION/kicad-$env:KICAD_VERSION-x86_64.exe"
          curl.exe -L --fail --retry 3 -o installers/scilab.exe "https://oos.eu-west-2.outscale.com/scilab-releases/$env:SCILAB_VERSION/scilab-$env:SCILAB_VERSION.bin.x64.exe"
          Get-ChildItem installers | Format-Table Name, Length

      - name: Save the installers
        if: steps.installers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: installers
          key: installers-octave${{ env.OCTAVE_VERSION }}-kicad${{ env.KICAD_VERSION }}-scilab${{ env.SCILAB_VERSION }}

      - name: "Test: the Octave scripts in GNU Octave for Windows (batch)"
        run: |
          7z x installers/octave.7z -oC:\octave -y | Out-Null
          $cli = Get-ChildItem C:\octave -Recurse -Filter octave-cli.exe | Where-Object FullName -like '*mingw64\bin\*' | Select-Object -First 1
          Write-Output "Octave: $($cli.FullName)"
          $dir = (Resolve-Path "dist/PredictiveBMS/3 Octave model check").Path
          & $cli.FullName --no-gui --eval "cd('$dir'); thermal_step(); r = crosscheck(); if ~all([r.pass]), exit(1); end"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: "Test: the Octave scripts in the Octave window, as the student runs them"
        timeout-minutes: 15
        continue-on-error: true
        run: |
          $bin = (Get-ChildItem C:\octave -Recurse -Filter octave-gui.exe | Where-Object FullName -like '*mingw64\bin\*' | Select-Object -First 1).DirectoryName
          # A settings file skips the welcome wizard that the first start of the window shows.
          foreach ($d in "$env:APPDATA\octave", "$env:LOCALAPPDATA\octave") {
            New-Item -ItemType Directory -Force $d | Out-Null
            Set-Content -Path "$d\qt-settings" -Value "[General]"
          }
          $dir = (Resolve-Path "dist/PredictiveBMS/3 Octave model check").Path
          Remove-Item "$dir/results" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $bin -Filter 'octave*.exe' | Format-Table Name, Length
          $eval = "cd('$dir'); diary('gui-diary.txt'); try, thermal_step(); r = crosscheck({'load_defect'}); ok = all([r.pass]) && isguirunning(); catch e, disp(e.message); ok = false; end; diary('off'); fid = fopen('gui-check.txt', 'w'); fprintf(fid, '%d', ok); fclose(fid); exit(0);"
          # The installer's Start-menu shortcut tells Qt where its plugins are; the archive used here
          # does not, so the test does it.
          $qwin = Get-ChildItem C:\octave -Recurse -Filter qwindows.dll | Select-Object -First 1
          Write-Output "Qt platform plugin: $($qwin.FullName)"
          $env:QT_PLUGIN_PATH = $qwin.Directory.Parent.FullName
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = $qwin.DirectoryName
          $p = Start-Process -FilePath "$bin\octave.exe" -ArgumentList @('--gui', '--eval', "`"$eval`"") -PassThru `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\gui-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\gui-err.txt"
          if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force; throw "the Octave window did not finish within 10 minutes" }
          # The launcher may return before the window closes: wait for the window too.
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Process octave-gui -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep 5 }
          Write-Output "octave exit code: $($p.ExitCode)"
          Get-Content "$env:RUNNER_TEMP\gui-out.txt", "$env:RUNNER_TEMP\gui-err.txt" -ErrorAction SilentlyContinue
          Get-Content "$dir/gui-diary.txt" -ErrorAction SilentlyContinue
          Get-ChildItem "$dir/results" -ErrorAction SilentlyContinue | Format-Table Name, Length
          $ok = Get-Content "$dir/gui-check.txt" -ErrorAction SilentlyContinue
          Write-Output "check in the Octave window: $ok"
          if ($ok -ne '1') { throw "the scripts did not pass in the Octave window" }
          foreach ($f in 'thermal_step.png', 'crosscheck_load_defect.png') {
            if (-not (Test-Path "$dir/results/$f")) { throw "$f was not saved in the Octave window" }
          }
          Remove-Item "$dir/gui-check.txt"

      - name: "Test: the KiCad projects in KiCad for Windows"
        run: |
          # The KiCad installer hands over to a second, elevated copy of itself (exit code
          # 666660), which never finishes in a silent run on this machine. Its files are
          # unpacked with 7-Zip instead: the same kicad-cli.exe and ngspice library as an
          # installed KiCad. On the user's PC the normal installer is used.
          7z x installers/kicad.exe -oC:\KiCad -y | Out-Null
          $cli = Get-ChildItem C:\KiCad -Recurse -Filter kicad-cli.exe | Select-Object -First 1
          if (-not $cli) { Get-ChildItem C:\KiCad | Format-Table Name; throw "kicad-cli.exe is not in the installer" }
          Write-Output "kicad-cli: $($cli.FullName)"
          python .github/scripts/kicad_check.py $cli.Directory.Parent.FullName "dist/PredictiveBMS/2 KiCad circuits"

      - name: "Test: Scilab and Xcos for Windows"
        run: |
          Start-Process installers/scilab.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\Scilab' -Wait
          # Scilab 2027 takes no -nw option itself: its launcher turns "scilab -nw" into
          # WScilex-cli.exe, the console version with Xcos, which is called directly here.
          $cli = "C:\Scilab\bin\WScilex-cli.exe"
          if (-not (Test-Path $cli)) { Get-ChildItem C:\Scilab\bin | Format-Table Name; throw "WScilex-cli.exe is not installed" }
          & $cli -nb -quit -f .github/scripts/scilab_smoke.sce
          if ($LASTEXITCODE -ne 0) { throw "the Xcos smoke test failed ($LASTEXITCODE)" }
          if (Test-Path scilab/check_models.sce) {
            & $cli -nb -quit -f scilab/check_models.sce
            if ($LASTEXITCODE -ne 0) { throw "the Xcos models failed their checks ($LASTEXITCODE)" }
          }

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/PredictiveBMS-Windows.zip --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/PredictiveBMS-Windows.zip --title "Predictive BMS $env:GITHUB_REF_NAME" --notes "Windows package: download PredictiveBMS-Windows.zip, extract it, and open START HERE.pdf."
          }
